services:
  mcp:
    build: .
    image: yandex-cloud-management-mcp:local
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MCP_LOCAL_PORT:-8765}:3000'
    env_file:
      - .local/server.env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: '3000'
      MCP_HTTP_TOKEN_FILE: /run/credentials/http-token
    volumes:
      - ./.local:/run/credentials:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
